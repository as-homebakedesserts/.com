name: Deploy A&S bakery site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the menu at the published sheet
        env:
          MENU_CSV_URL: ${{ vars.MENU_CSV_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.MENU_CSV_URL;
            if (!url) {
              console.log("MENU_CSV_URL repo variable is not set, keeping the URL committed in site-config.js");
              process.exit(0);
            }
            const file = "site-config.js";
            const src = fs.readFileSync(file, "utf8");
            const re = /window\.MENU_CSV_URL\s*=\s*[^;]*;/;
            if (!re.test(src)) {
              throw new Error("site-config.js has no window.MENU_CSV_URL line to update");
            }
            fs.writeFileSync(file, src.replace(re, "window.MENU_CSV_URL = " + JSON.stringify(url) + ";"));
            console.log("site-config.js now reads the sheet from the repo variable");
          '
      - name: Assemble bakery homepage and menu
        run: |
          mkdir -p site/menu site/Baker
          cp -R Baker/. site/
          cp -R Baker/. site/Baker/
          cp Baker/3d-bakery.html site/index.html
          cp index.html style.css script.js site-config.js image-urls.js submit-order.js order.js menu-images.csv developer-avatar.png site/menu/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4